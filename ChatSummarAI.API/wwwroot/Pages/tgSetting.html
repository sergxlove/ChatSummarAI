<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatSummar - Telegram Settings</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0b0f1a;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(18, 26, 40, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #e8edf5;
        }

            .navbar-brand .icon {
                width: 38px;
                height: 38px;
                background: linear-gradient(135deg, #0088ff, #0055cc);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                color: #fff;
                box-shadow: 0 4px 14px rgba(0, 119, 255, 0.3);
            }

            .navbar-brand .name {
                font-size: 22px;
                font-weight: 700;
                letter-spacing: -0.3px;
            }

                .navbar-brand .name span {
                    font-weight: 300;
                    opacity: 0.5;
                }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
        }

        .settings-card {
            width: 100%;
            max-width: 540px;
            background: rgba(18, 26, 40, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }

        .settings-header {
            margin-bottom: 32px;
        }

            .settings-header h2 {
                font-size: 24px;
                font-weight: 700;
                margin-bottom: 6px;
            }

            .settings-header p {
                color: #7a8aa3;
                font-size: 15px;
            }

        .form-group {
            margin-bottom: 22px;
        }

            .form-group label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: #8899b0;
                margin-bottom: 6px;
                letter-spacing: 0.2px;
            }

                .form-group label i {
                    margin-right: 8px;
                    color: #4fc3ff;
                    width: 18px;
                }

        .input-wrapper {
            position: relative;
        }

            .input-wrapper input {
                width: 100%;
                padding: 12px 16px;
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.07);
                border-radius: 10px;
                color: #e8edf5;
                font-size: 15px;
                font-family: inherit;
                transition: all 0.25s ease;
                outline: none;
            }

                .input-wrapper input::placeholder {
                    color: #3a4a5e;
                    font-size: 14px;
                }

                .input-wrapper input:focus {
                    border-color: #0088ff;
                    background: rgba(0, 136, 255, 0.06);
                    box-shadow: 0 0 0 4px rgba(0, 136, 255, 0.08);
                }

                .input-wrapper input:hover {
                    border-color: rgba(255, 255, 255, 0.12);
                }

            .input-wrapper .toggle-visibility {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: #4a5a6e;
                cursor: pointer;
                font-size: 15px;
                padding: 4px;
                transition: color 0.2s;
            }

                .input-wrapper .toggle-visibility:hover {
                    color: #8899b0;
                }

        .hint {
            font-size: 12px;
            color: #3a4a5e;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .hint a {
                color: #4fc3ff;
                text-decoration: none;
            }

                .hint a:hover {
                    text-decoration: underline;
                }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0088ff, #0055cc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 136, 255, 0.25);
        }

            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 32px rgba(0, 136, 255, 0.35);
                background: linear-gradient(135deg, #1a8eff, #0066dd);
            }

            .btn-submit:active {
                transform: translateY(0);
            }

            .btn-submit:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none !important;
                box-shadow: none !important;
            }

            .btn-submit .spinner {
                display: none;
                width: 20px;
                height: 20px;
                border: 2px solid rgba(255, 255, 255, 0.2);
                border-top-color: #fff;
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }

            .btn-submit.loading .spinner {
                display: inline-block;
            }

            .btn-submit.loading .btn-text {
                display: none;
            }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }

            .status.show {
                display: flex;
            }

            .status.success {
                background: rgba(0, 200, 83, 0.08);
                border: 1px solid rgba(0, 200, 83, 0.12);
                color: #4cdb8c;
            }

            .status.error {
                background: rgba(255, 70, 70, 0.08);
                border: 1px solid rgba(255, 70, 70, 0.12);
                color: #ff6b6b;
            }

            .status.info {
                background: rgba(0, 180, 255, 0.08);
                border: 1px solid rgba(0, 180, 255, 0.12);
                color: #4fc3ff;
            }

            .status i {
                font-size: 18px;
            }

        @media (max-width: 640px) {
            .navbar {
                padding: 0 16px;
                height: 60px;
            }

            .navbar-brand .name {
                font-size: 18px;
            }

            .settings-card {
                padding: 28px 20px;
                border-radius: 16px;
            }
        }

        @media (max-width: 480px) {
            .settings-card {
                padding: 24px 16px;
            }

            .settings-header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="navbar-brand">
            
            <div class="name">Chat<span>Summar</span></div>
        </a>
    </nav>
    <div class="main">

        <div class="settings-card">

            <div class="settings-header">
                <h2>Настройки Telegram</h2>
                <p>Введите данные для подключения вашего бота</p>
            </div>

            <form id="settingsForm" novalidate>
                <div class="form-group">
                    <label for="botToken">
                        <i class="fas fa-key"></i> Bot Token
                    </label>
                    <div class="input-wrapper">
                        <input type="password"
                               id="botToken"
                               placeholder="1234567890:ABCdefGHIjklMNOpqrsTUVwxyz"
                               required />
                        <button type="button"
                                class="toggle-visibility"
                                id="toggleBotToken"
                                aria-label="Toggle visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="hint">
                        <i class="fas fa-info-circle"></i>
                        Получите у <a href="https://t.me/botfather" target="_blank">@BotFather</a>
                    </div>
                </div>
                <div class="form-group">
                    <label for="chatId">
                        <i class="fas fa-hashtag"></i> Chat ID
                    </label>
                    <div class="input-wrapper">
                        <input type="text"
                               id="chatId"
                               placeholder="-1001234567890"
                               required />
                    </div>
                    <div class="hint">
                        <i class="fas fa-info-circle"></i>
                        Узнайте через <a href="https://t.me/userinfobot" target="_blank">@userinfobot</a>
                    </div>
                </div>
                <div class="form-group">
                    <label for="adminId">
                        <i class="fas fa-user-shield"></i> Admin ID
                    </label>
                    <div class="input-wrapper">
                        <input type="text"
                               id="adminId"
                               placeholder="123456789"
                               required />
                    </div>
                    <div class="hint">
                        <i class="fas fa-info-circle"></i>
                        Ваш Telegram ID (для белого списка)
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">
                        <i class="fas fa-save"></i> Сохранить настройки
                    </span>
                    <span class="spinner"></span>
                </button>

            </form>

            <div class="status" id="status">
                <i class="fas fa-check-circle"></i>
                <span id="statusText">Настройки сохранены!</span>
            </div>

        </div>

    </div>
    <script>
        (function() {
            'use strict';

            const form = document.getElementById('settingsForm');
            const botTokenInput = document.getElementById('botToken');
            const chatIdInput = document.getElementById('chatId');
            const adminIdInput = document.getElementById('adminId');
            const submitBtn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const toggleBtn = document.getElementById('toggleBotToken');
            let isVisible = false;
            toggleBtn.addEventListener('click', function() {
                isVisible = !isVisible;
                botTokenInput.type = isVisible ? 'text' : 'password';
                toggleBtn.innerHTML = isVisible
                    ? '<i class="fas fa-eye-slash"></i>'
                    : '<i class="fas fa-eye"></i>';
            });
            function showStatus(message, type) {
                status.className = 'status show ' + type;
                statusText.textContent = message;
                clearTimeout(window._statusTimeout);
                if (type === 'success' || type === 'info') {
                    window._statusTimeout = setTimeout(() => {
                        status.classList.remove('show');
                    }, 5000);
                }
            }

            function hideStatus() {
                status.classList.remove('show');
            }

            function setLoading(isLoading) {
                submitBtn.classList.toggle('loading', isLoading);
                submitBtn.disabled = isLoading;
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideStatus();

                const botToken = botTokenInput.value.trim();
                const chatId = chatIdInput.value.trim();
                const adminId = adminIdInput.value.trim();

                if (!botToken) {
                    showStatus('Введите Bot Token', 'error');
                    botTokenInput.focus();
                    return;
                }
                if (!chatId) {
                    showStatus('Введите Chat ID', 'error');
                    chatIdInput.focus();
                    return;
                }
                if (!adminId) {
                    showStatus('Введите Admin ID', 'error');
                    adminIdInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const response = await fetch('/api/setting/tg', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ botToken, chatId, adminId })
                    });

                    if (response.ok) {
                        showStatus('✅ Настройки успешно сохранены!', 'success');
                        botTokenInput.value = '';
                        chatIdInput.value = '';
                        adminIdInput.value = '';
                    } else if (response.status === 409) {
                        showStatus('⚠️ Файл настроек уже существует', 'info');
                    } else {
                        const text = await response.text();
                        showStatus('❌ Ошибка: ' + (text || 'Неизвестная ошибка'), 'error');
                    }
                } catch {
                    showStatus('❌ Ошибка соединения с сервером', 'error');
                } finally {
                    setLoading(false);
                }
            });

            [botTokenInput, chatIdInput, adminIdInput].forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        form.dispatchEvent(new Event('submit'));
                    }
                });
            });

            botTokenInput.focus();

        })();
    </script>

</body>
</html>
